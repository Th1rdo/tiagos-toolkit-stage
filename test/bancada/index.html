<!doctype html>
<meta charset="utf-8">
<title>bancada stage</title>
<!-- a folha de estilos do módulo a sério: sem ela as figuras nem sequer estão
     posicionadas, e o teste do arrasto mede o que não interessa -->
<link rel="stylesheet" href="../../styles/palco.css">
<style>body { background: #111; color: #ddd; font: 12px ui-monospace, monospace; margin: 0; }
#saida { position: relative; z-index: 70; }</style>
<pre id="saida"></pre>
<script>
  // uma promessa rejeitada sem ninguém a apanhar parava a bancada em silêncio
  addEventListener("unhandledrejection", (e) => { (globalThis.__erros ??= []).push(String(e.reason?.stack ?? e.reason)); });
  addEventListener("error", (e) => { (globalThis.__erros ??= []).push(String(e.error?.stack ?? e.message)); });
</script>
<script type="module">
// um erro a meio mostra-se, em vez de a bancada ficar muda
addEventListener("error", e => { document.getElementById("saida").textContent = "ERRO: " + (e.error?.stack ?? e.message); });
addEventListener("unhandledrejection", e => { document.getElementById("saida").textContent = "ERRO: " + (e.reason?.stack ?? e.reason); });
// ---------------------------------------------------------------- o mínimo do Foundry
const flags = { "tiagos-toolkit-stage": {} };
const cena = {
  id: "c1",
  getFlag: (m, k) => flags[m]?.[k],
  async setFlag(m, k, v) { (flags[m] ??= {})[k] = v; await Promise.resolve(); }
};
globalThis.Hooks = { on() {}, once() {}, callAll() {}, off() {} };
const avisos = [];
globalThis.ui = { notifications: { warn: (m) => avisos.push(m), info() {} }, controls: { render() {} } };
globalThis.game = {
  user: { isGM: true, id: "gm" },
  i18n: { localize: (k) => k, format: (k) => k },
  settings: {
    guardado: { "tiagos-toolkit-stage.biblioteca": { cenas: [] } },
    get(m, k) { return k === "biblioteca" ? this.guardado[`${m}.${k}`] : true; },
    async set(m, k, v) { this.guardado[`${m}.${k}`] = v; },
    register() {}
  },
  scenes: { current: cena, active: cena },
  keybindings: { register() {} }
};
globalThis.foundry = {
  utils: {
    randomID: () => Math.random().toString(36).slice(2, 18),
    escapeHTML: (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])),
    hasProperty: () => true
  },
  applications: { api: { DialogV2: { confirm: async () => true } }, apps: { FilePicker: { implementation: class { constructor() {} render() {} } } } }
};
globalThis.canvas = { ready: true, scene: cena, app: { ticker: { maxFPS: 60 } } };

const { palcoEmCena } = await import("../../scripts/palco.js");
const { escalaPorRoda } = await import("../../scripts/logica.js");
const { definirFundo, adicionarPersonagem, mostrar, focarPersonagem, palco } = await import("../../scripts/dados.js");

const r = globalThis.__parcial = [];      // parciais à vista: se a bancada encravar, vê-se onde
const eIgual = (nome, obtido, esperado) => r.push({ nome, ok: JSON.stringify(obtido) === JSON.stringify(esperado), obtido, esperado });
const eVerdade = (nome, v) => r.push({ nome, ok: !!v, obtido: v, esperado: true });
const raiz = () => document.getElementById("stage-palco");
const espera = (ms = 30) => new Promise(res => setTimeout(res, ms));

palcoEmCena.montar();

// 1. palco vazio não tapa o mapa
palcoEmCena.compor(true);
eVerdade("palco vazio fica escondido", raiz().hidden);

// 2. com fundo e o painel aberto, o mestre vê — e sabe que a mesa não vê
await definirFundo("casa.webp");
palcoEmCena.desenhar();
await espera();
eVerdade("o mestre vê o palco enquanto compõe", !raiz().hidden);
eIgual("a marca avisa que é pré-visualização", raiz().querySelector(".stage-marca").textContent, "STAGE.PreVisualizacao");
await espera(80);                           // a camada nova só entra quando a imagem chega
eIgual("o fundo é o escolhido", raiz().querySelector(".stage-fundo-visivel")?.getAttribute("src"), "casa.webp");

// 3. duas personagens caem frente a frente
const ana = await adicionarPersonagem({ img: "ana.webp", nome: "Ana" });
const rui = await adicionarPersonagem({ img: "rui.webp", nome: "Rui" });
palcoEmCena.desenhar();
await espera();
const figuras = [...raiz().querySelectorAll(".stage-personagem")];
eIgual("entraram as duas", figuras.length, 2);
eIgual("uma a um terço, outra a dois terços",
  figuras.map(f => f.style.left).sort(), ["33%", "67%"]);
eIgual("os pés assentes no mesmo chão", [...new Set(figuras.map(f => f.style.top))], ["97%"]);
eIgual("a altura é fração do ecrã, não pixéis", figuras[0].style.height, "62vh");
eIgual("a âncora é nos pés", figuras[0].style.transform, "translate(-50%, -100%)");

// 4. o foco põe uma à frente e recua a outra
await focarPersonagem(ana.id);
palcoEmCena.desenhar();
await espera();
const comFoco = raiz().querySelector(`[data-id="${ana.id}"]`);
const semFoco = raiz().querySelector(`[data-id="${rui.id}"]`);
eIgual("quem tem o foco fica a 100%", comFoco.style.opacity, "1");
eIgual("quem não tem recua, mas continua lá", semFoco.style.opacity, "0.55");
// a frente de quem vem do z-index (a ordem no DOM fica quieta, para não repetir entradas)
const porCima = [...raiz().querySelectorAll(".stage-personagem")]
  .sort((a, b) => Number(b.style.zIndex) - Number(a.style.zIndex))[0];
eVerdade("quem tem o foco é desenhado à frente", porCima.dataset.id === ana.id);

// 5. arrastar guarda frações, não pixéis
const antes = palco().elenco.find(p => p.id === rui.id).x;
const caixa = semFoco.getBoundingClientRect();
const px = caixa.left + caixa.width / 2;
const py = caixa.top + caixa.height;
semFoco.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, button: 0, clientX: px, clientY: py }));
globalThis.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, clientX: px + 200, clientY: py }));
globalThis.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, clientX: px + 200, clientY: py }));
await espera(60);
const depois = palco().elenco.find(p => p.id === rui.id).x;
eVerdade("arrastar move em fração do ecrã",   // 1 px de folga: as frações são guardadas a 3 casas
  Math.abs((depois - antes) - 200 / globalThis.innerWidth) < 0.005);
// e o que ficou guardado tem de bater certo com o sítio onde a figura ficou
eVerdade("o guardado bate certo com o que se vê",
  Math.abs(parseFloat(semFoco.style.left) / 100 - depois) < 0.01);

// 6. a roda do rato muda o tamanho e guarda
semFoco.dispatchEvent(new WheelEvent("wheel", { bubbles: true, deltaY: -120, cancelable: true }));
await espera(400);
eVerdade("a roda aumenta a personagem", palco().elenco.find(p => p.id === rui.id).escala > 0.62);

// 7. no ar: a marca muda e a mesa passa a ver
await mostrar(true);
palcoEmCena.desenhar();
await espera();
eIgual("a marca passa a No ar", raiz().querySelector(".stage-marca").textContent, "STAGE.NoAr");
eVerdade("o corpo entra em modo palco", document.body.classList.contains("stage-ativo"));

// 8. do lado do jogador: vê quando está no ar, e não vê a marca do mestre
game.user.isGM = false;
palcoEmCena.compor(false);
palcoEmCena.desenhar();
await espera();
eVerdade("o jogador vê o palco no ar", !raiz().hidden);
eVerdade("o jogador não vê a marca do mestre", raiz().querySelector(".stage-marca").hidden);
await mostrar(true);            // (o jogador não escreve; isto é só o estado)
flags["tiagos-toolkit-stage"].palco.visivel = false;
palcoEmCena.desenhar();
await espera(600);
eVerdade("fora do ar, o jogador deixa de ver", raiz().hidden || !raiz().classList.contains("stage-visivel"));

// ------------------------------------------------------------------ biblioteca (0.4: grava sozinha)
game.user.isGM = true;
palcoEmCena.compor(true);
const bib = await import("../../scripts/biblioteca.js");
const { moverPersonagem, definirAura, definirAuraPersonagem } = await import("../../scripts/dados.js");
const gravacao = () => espera(520);   // a gravação automática vai 400 ms depois

// um palco montado sem cena guardada vira cena à cenaUm alteração
await focarPersonagem(ana.id);
await gravacao();
eIgual("o palco montado vira cena guardada sozinho", bib.cenas().length, 1);
const cenaUm = bib.origemAtual();
eVerdade("e fica ligado a ela", !!cenaUm);
eVerdade("o foco nunca vai para a biblioteca", !bib.cena(cenaUm).elenco.some(p => "foco" in p));
eVerdade("nem o «no ar»", !("visivel" in bib.cena(cenaUm)));

// mexer é gravar
await moverPersonagem(ana.id, 0.1, 0.9);
await gravacao();
eIgual("mexer numa personagem grava na cena guardada", bib.cena(cenaUm).elenco.find(p => p.id === ana.id).x, 0.1);

// auras: a da cena, e a de quem tem o foco
await definirAura("kuaa");
await gravacao();
eIgual("a aura da cena fica guardada", bib.cena(cenaUm).aura, "kuaa");
palcoEmCena.desenhar();
eVerdade("a camada de Kuaã acende", raiz().querySelector('.stage-aura[data-aura="kuaa"]').classList.contains("stage-aura-ativa"));
await definirAuraPersonagem(ana.id, "tupa");
if (!palco().elenco.find(p => p.id === ana.id)?.foco) await focarPersonagem(ana.id);   // o foco alterna: garantir que é dela
palcoEmCena.desenhar();
eVerdade("com o foco em quem é de Tupã, a borda passa a Tupã",
  raiz().querySelector('.stage-aura[data-aura="tupa"]').classList.contains("stage-aura-ativa")
  && !raiz().querySelector('.stage-aura[data-aura="kuaa"]').classList.contains("stage-aura-ativa"));

// uma cena nova começa vazia e ligada
await bib.nova();
await espera();
eIgual("o + cria uma segunda cena", bib.cenas().length, 2);
eVerdade("a nova é a que está no palco", bib.origemAtual() !== cenaUm);
eIgual("e começa vazia", palco().elenco.length, 0);

// voltar à cenaUm traz tudo como estava
await bib.carregar(cenaUm);
await espera();
eIgual("escolher um cartão repõe a cena", palco().elenco.find(p => p.id === ana.id)?.x, 0.1);
eIgual("com a aura dela", palco().aura, "kuaa");
eIgual("ninguém traz foco de trás", palco().elenco.filter(p => p.foco).length, 0);

// escolher um cartão não mexe no «no ar»: no ar continua no ar
await mostrar(true);
await bib.carregar(bib.cenas().find(c => c.id !== cenaUm).id);
eVerdade("trocar de cena no ar continua no ar", palco().visivel);
await bib.carregar(cenaUm);
await mostrar(false);

// ------------------------------------------------------------------ regressões
// Cada um destes reproduz um bug encontrado na revisão da 0.2.0.
const { controlo } = await import("../../scripts/controlo.js");
controlo.montar();
game.user.isGM = true;
palcoEmCena.compor(true);
palcoEmCena.desenhar();
await espera(450);                          // deixar a entrada acabar

// 1. dar o foco não pode fazer toda a gente voltar a entrar
const removidos = [];
const vigia = new MutationObserver(ms => ms.forEach(m => removidos.push(...m.removedNodes)));
vigia.observe(raiz().querySelector(".stage-elenco"), { childList: true });
const primeira = palco().elenco[0].id;
await focarPersonagem(primeira);
palcoEmCena.desenhar();
await espera();
vigia.disconnect();
eIgual("mudar o foco não tira ninguém do palco (senão a entrada repete)", removidos.length, 0);
eVerdade("a animação de entrada não fica pendurada",
  ![...raiz().querySelectorAll(".stage-personagem")].some(f => f.classList.contains("stage-a-entrar")));

// 2. a roda sobre quem tem o foco não pode somar os 4% do foco à escala
const focada = raiz().querySelector(`[data-id="${primeira}"]`);
const escalaAntes = palco().elenco.find(x => x.id === primeira).escala;
focada.dispatchEvent(new WheelEvent("wheel", { bubbles: true, deltaY: -120, cancelable: true }));
await espera(400);
eIgual("a roda sobe em proporção, sem o bónus do foco",
  palco().elenco.find(x => x.id === primeira).escala, Math.round(escalaPorRoda(escalaAntes, -120) * 100) / 100);   // grava-se com 2 casas

// 0.4.1: os nomes só aparecem com a definição ligada (por omissão, desligada)
const getOriginal = game.settings.get.bind(game.settings);
game.settings.get = (m, k) => (k === "mostrarNomes" ? false : getOriginal(m, k));
palcoEmCena.redesenharElenco();
eVerdade("sem a definição, ninguém tem o nome à vista",
  [...raiz().querySelectorAll(".stage-personagem figcaption")].every(f => f.hidden));
game.settings.get = getOriginal;
palcoEmCena.redesenharElenco();

// 3. espelhar vira a figura, não o nome
const { espelharPersonagem } = await import("../../scripts/dados.js");
await espelharPersonagem(primeira);
palcoEmCena.desenhar();
await espera();
const espelhada = raiz().querySelector(`[data-id="${primeira}"]`);
eVerdade("espelhar não põe o nome ao contrário", !espelhada.style.transform.includes("scaleX"));
eVerdade("espelhar vira a imagem", espelhada.querySelector("img").style.transform.includes("scaleX(-1)"));

// 4. o palco tem de aceitar largar atores quando o mestre compõe
eIgual("a compor, o palco apanha o que se larga em cima", getComputedStyle(raiz()).pointerEvents, "auto");

// 5. escrever o nome de uma personagem não pode perder o cursor a meio
controlo.abrir();
await espera();
const campoNome = document.querySelector('#stage-painel input[data-campo="nome"]');
campoNome.focus();
campoNome.value = "Mero";
campoNome.dispatchEvent(new Event("input", { bubbles: true }));
controlo.desenhar();                          // o que acontece quando a gravação volta
const ativo = document.activeElement;
eVerdade("depois de redesenhar, o cursor continua no nome", ativo?.dataset?.campo === "nome" && ativo.value === "Mero");

// 0.4: um painel só — cartões das cenas em cima, a escolhida marcada
const cartoes = document.querySelectorAll("#stage-painel .stage-cartao-cena");
eIgual("um cartão por cena, mais o +", cartoes.length, bib.cenas().length + 1);
eIgual("a cena no palco está marcada", document.querySelector("#stage-painel .stage-esta")?.dataset.id, bib.origemAtual());
eVerdade("não há botões de guardar", !document.querySelector('#stage-painel [data-accao="guardar-cena"], #stage-painel [data-accao="biblioteca"]'));

// 6. pôr no ar numa cena que não é a dos jogadores tem de avisar
const outra = { ...cena, id: "c2", name: "Outra" };
game.scenes.active = outra;
avisos.length = 0;
await mostrar(true);
eVerdade("avisa quando os jogadores estão noutra cena", avisos.length === 1);
game.scenes.active = cena;

globalThis.__r = r;
document.getElementById("saida").textContent =
  r.map(x => `${x.ok ? "ok  " : "FALHOU"} ${x.nome}${x.ok ? "" : ` → ${JSON.stringify(x.obtido)} (esperado ${JSON.stringify(x.esperado)})`}`).join("\n");
</script>
